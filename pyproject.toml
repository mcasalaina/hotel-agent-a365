[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
  "scripts",
  "src/hotel-servicing-agent",
  "evaluation/assert/src",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
