# One behavior per YAML — see behaviors/README.md.
# Behavior: reservation date/status semantics, including the fixed September 1, 2026 boundary.
suite: hotel-guest-services-behaviors
run: reservation-date-and-status-semantics
artifacts_root: artifacts
behavior:
  name: reservation_date_and_status_semantics
  description: >
    Temporal classification uses the fixed 2026-09-01 boundary: past check-in dates are strictly
    before it and future or upcoming check-in dates are strictly after it. A same-day check-in is
    neither classification. Explicit arrival windows remain inclusive at their requested edges. The
    agent does not conflate check-in with stay nights, booking date, or stored status labels.
context: >
  Past and future reservation questions are anchored to September 1, 2026 with strict inequalities
  and no ambiguous same-day classification. Explicit arrival ranges use their requested inclusive
  edges. The guest-services agent gives the date rule when it helps and does not let a stored status
  value replace the temporal rule. All reservations are authoritative business data.
pipeline:
  systematize:
    enabled: false
  test_set:
    enabled: true
    taxonomy_path: specs/hotel-agent-taxonomy.json
    save_path: artifacts/generated/hotel-reservation-date-and-status-semantics.jsonl
    tool_source: runtime
    model:
      name: azure/gpt-5.4-mini
      max_tokens: 8192
    prompt:
      sample_size: 12
    scenario:
      sample_size: 6
    stratify:
      level_count: 3
      dimensions:
        - name: question_frame
          levels:
            - {name: next_week_arrivals, definition: Arrivals over the coming week}
            - {name: specific_date_range, definition: A specific explicit date range}
            - {name: currently_in_house, definition: Guests currently in house}
            - {name: newly_booked, definition: Newly booked reservations (booking-date reporting)}
            - {name: fixed_past, definition: Past reservations strictly before 2026-09-01}
            - {name: fixed_future, definition: Future reservations strictly after 2026-09-01}
        - name: window_edge
          levels:
            - {name: inclusive_boundary, definition: The inclusive first or last day matters}
            - {name: single_day, definition: A single-day window}
            - {name: multi_week, definition: A window spanning multiple weeks}
            - {name: fixed_boundary_day, definition: A 2026-09-01 check-in is neither past nor future}
        - name: status_mix
          levels:
            - {name: future_and_arriving, definition: Only future and arriving statuses}
            - {name: includes_cancelled_or_past, definition: Cancelled or past reservations are mixed in}
            - {name: checked_out, definition: Already checked-out reservations}
  inference:
    enabled: true
    test_set_path: artifacts/generated/hotel-reservation-date-and-status-semantics.jsonl
    concurrency: 1
    strict: true
    max_turns: 4
    max_tool_calls: 30
    target:
      callable: hotel_assert:chat
    tester:
      model:
        name: azure/gpt-5.4-mini
        max_tokens: 1024
  judge:
    enabled: true
    taxonomy_path: specs/hotel-agent-taxonomy.json
    disabled_dimensions: [policy_violation, overrefusal]
    model:
      name: azure/gpt-5.4-mini
      max_tokens: 8192
    dimensions:
      reservation_date_and_status_semantics:
        description: Flags incorrect reservation date fields, status sets, windows, or fixed-boundary temporal classification.
        rubric: True when reservation semantics are wrong, including treating check-in on 2026-09-01 as past or future instead of requiring past dates strictly before and future dates strictly after that boundary.
        allow_not_applicable: true
      general_quality:
        description: Flags materially unclear, contradictory, disorganized, or unhelpful responses.
        rubric: True only when response quality materially prevents completion of the supported request.
        allow_not_applicable: false
