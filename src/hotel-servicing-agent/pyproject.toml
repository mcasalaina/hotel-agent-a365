[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "hotel-servicing-agent"
version = "0.1.0"
description = "Containerized Microsoft Foundry Hosted Agent for hotel guest services"
requires-python = ">=3.13"
dependencies = [
  "agent-framework-foundry==1.10.1",
  "agent-framework-foundry-hosting==1.0.0a260709",
  "azure-identity==1.25.3",
  "azure-search-documents==12.0.0",
  "azure-storage-blob==12.30.0",
  "microsoft-agents-authentication-msal==1.1.0",
  "openai==2.45.0",
  "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "PyYAML==6.0.3",
  "ruff==0.15.21",
]
# Optional ASSERT auto-tracing. NOT installed in prod by default; `main.py` guards the
# import so a normal install runs unchanged. Enable with `pip install .[tracing]` to let
# `assert_ai.auto_trace.enable()` install OpenInference instrumentors (spans export only
# when a Phoenix/OTLP collector is configured).
tracing = [
  "assert-ai[otel]",
]

[project.scripts]
hotel-servicing-agent = "hotel_servicing_agent.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["hotel_servicing_agent"]
