[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "hotel-servicing-agent"
version = "0.1.0"
description = "Containerized Microsoft Foundry Hosted Agent for hotel guest services"
requires-python = ">=3.13"
dependencies = [
  "agent-framework==1.11.0",
  "agent-framework-foundry-hosting==1.0.0a260709",
  "azure-identity==1.25.3",
  "python-dotenv==1.2.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.2.0",
  "pytest==9.1.1",
  "PyYAML==6.0.3",
  "ruff==0.15.21",
]

[project.scripts]
hotel-servicing-agent = "hotel_servicing_agent.runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["hotel_servicing_agent"]
