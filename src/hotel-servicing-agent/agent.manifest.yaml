name: hotel-servicing-agent
description: >
  A containerized hotel guest-services agent hosted by Microsoft Foundry.
metadata:
  tags:
    - Microsoft Foundry
    - Hosted Agent
    - Responses Protocol
template:
  name: hotel-servicing-agent
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: gpt-5.4-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
