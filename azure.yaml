# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  extensions:
    azure.ai.agents: ">=0.1.0-preview"

name: hotel-agent-a365

metadata:
  template: hotel-agent-a365

services:
  ai-project:
    host: azure.ai.project
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}

  hotel-servicing-agent:
    host: azure.ai.agent
    project: .
    language: docker
    uses:
      - ai-project
    kind: hosted
    name: hotel-servicing-agent
    displayName: Hotel Guest Services Agent
    description: Containerized guest-services agent built on Microsoft Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AGENT_INSTRUCTIONS_PATH: /app/agent-instructions.md
    startupCommand: ./startup.sh
    container:
      resources:
        cpu: "1"
        memory: 2Gi
