# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.4"

name: hotel-agent-a365

metadata:
  template: hotel-agent-a365

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 202

  hotel-servicing-agent:
    host: azure.ai.agent
    project: src/hotel-servicing-agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    kind: hosted
    name: hotel-servicing-agent
    displayName: Hotel Guest Services Agent
    description: Containerized guest-services agent built on Microsoft Foundry.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: AZURE_SEARCH_ENDPOINT
        value: ${AZURE_SEARCH_ENDPOINT}
      - name: FOUNDRY_IQ_KNOWLEDGE_BASE_NAME
        value: ${FOUNDRY_IQ_KNOWLEDGE_BASE_NAME}
      - name: AGENT_INSTRUCTIONS_PATH
        value: agent-instructions.md
    container:
      resources:
        cpu: "1"
        memory: 2Gi

infra:
  provider: microsoft.foundry
