# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: hotel-agent-a365
metadata:
    template: hotel-agent-a365
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 202
                name: GlobalStandard
    hotel-servicing-agent:
        project: src/hotel-servicing-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        description: Containerized guest-services agent built on Microsoft Foundry.
        displayName: Hotel Guest Services Agent
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: AZURE_SEARCH_ENDPOINT
              value: ${AZURE_SEARCH_ENDPOINT}
            - name: FOUNDRY_IQ_KNOWLEDGE_BASE_NAME
              value: ${FOUNDRY_IQ_KNOWLEDGE_BASE_NAME}
            - name: FABRIC_DATA_AGENT_MCP_URL
              value: ${FABRIC_DATA_AGENT_MCP_URL}
            - name: FABRIC_WORKSPACE_ID
              value: ${FABRIC_WORKSPACE_ID}
            - name: FABRIC_GUEST_SERVICES_LAKEHOUSE_ID
              value: ${FABRIC_GUEST_SERVICES_LAKEHOUSE_ID}
            - name: FABRIC_RESERVATION_NOTEBOOK_ID
              value: ${FABRIC_RESERVATION_NOTEBOOK_ID}
            - name: AGENT365_TENANT_ID
              value: ${AGENT365_TENANT_ID}
            - name: AGENT365_BLUEPRINT_CLIENT_ID
              value: ${AGENT365_BLUEPRINT_CLIENT_ID}
            - name: AGENT365_BLUEPRINT_SECRET_VAULT_URL
              value: ${AGENT365_BLUEPRINT_SECRET_VAULT_URL}
            - name: AGENT365_BLUEPRINT_SECRET_NAME
              value: ${AGENT365_BLUEPRINT_SECRET_NAME}
            - name: AGENT365_INSTANCE_CLIENT_ID
              value: ${AGENT365_INSTANCE_CLIENT_ID}
            - name: A365_USE_S2S_ENDPOINT
              value: "true"
            - name: WORK_IQ_COPILOT_MCP_URL
              value: ${WORK_IQ_COPILOT_MCP_URL}
            - name: WORK_IQ_COPILOT_MCP_AUDIENCE
              value: ${WORK_IQ_COPILOT_MCP_AUDIENCE}
            - name: WORK_IQ_MAIL_MCP_URL
              value: ${WORK_IQ_MAIL_MCP_URL}
            - name: WORK_IQ_MAIL_MCP_AUDIENCE
              value: ${WORK_IQ_MAIL_MCP_AUDIENCE}
            - name: WORK_IQ_TEAMS_MCP_URL
              value: ${WORK_IQ_TEAMS_MCP_URL}
            - name: WORK_IQ_TEAMS_MCP_AUDIENCE
              value: ${WORK_IQ_TEAMS_MCP_AUDIENCE}
            - name: AGENT_INSTRUCTIONS_PATH
              value: agent-instructions.md
        kind: hosted
        name: hotel-servicing-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
