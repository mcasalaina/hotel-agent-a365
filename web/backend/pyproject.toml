[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "hotel-voice-proxy"
version = "0.1.0"
description = "Authenticated browser proxy for the Lyrenza Hotels Voice Live frontend"
requires-python = ">=3.13"
dependencies = [
  "aiohttp==3.13.3",
  "azure-identity==1.25.3",
  "PyJWT[crypto]==2.12.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
]

[project.scripts]
hotel-voice-proxy = "hotel_voice_proxy.app:main"

[tool.hatch.build.targets.wheel]
packages = ["hotel_voice_proxy"]
